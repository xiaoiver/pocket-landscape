<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>蕨间小径 · 口袋景观</title>
<style>
*{box-sizing:border-box}
:root{--ink:#333d31;--muted:#596152;--paper:#f8f6ed;--line:#c9cbbb;--fern:#40583f}
body{margin:0;background:#e9e5da;color:var(--ink);font-family:"PingFang SC","Hiragino Sans GB",sans-serif}
#garden{display:block;width:100vw;height:100dvh;touch-action:none;outline:0}
header,footer,#status{position:fixed}
header,footer{pointer-events:none}
header{top:max(4.6vh,env(safe-area-inset-top));left:4.2vw;z-index:2}
.brand{display:flex;align-items:baseline;gap:12px}
.brand b{font-size:17px;letter-spacing:.14em;font-weight:600}
.brand i{font:italic 16px Georgia,serif;color:#57614f}
footer{left:4.2vw;bottom:max(5.5vh,env(safe-area-inset-bottom))}
h1{font:500 clamp(26px,3.4vw,48px)/1.3 "Songti SC","Noto Serif CJK SC",serif;letter-spacing:.07em;margin:0 0 8px}
.hint{font-size:12px;letter-spacing:.04em;margin:0;color:#575e50}
.credit{font-size:11px;margin:7px 0 0;color:#5d6358}
.credit a{pointer-events:auto;color:inherit;text-underline-offset:2px}
#status{inset:50% 0 auto;text-align:center;font-size:14px;pointer-events:none}
[hidden]{display:none!important}
button,input{font:inherit}
button{color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--fern);outline-offset:3px}
.controls{pointer-events:auto;margin-top:17px;width:max-content;max-width:calc(100vw - 32px)}
.tools{display:flex;gap:6px}
.trigger{border:1px solid var(--line);background:var(--paper);border-radius:24px;min-height:40px;display:flex;align-items:center;gap:8px;padding:0 13px;font-size:13px}
.trigger[aria-expanded=true]{background:var(--fern);color:var(--paper);border-color:var(--fern)}
.icon{width:17px;height:17px;fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round;stroke-width:1.6}
.chevron{width:10px;height:10px;transition:transform .16s ease-out}
[aria-expanded=true] .chevron{transform:rotate(180deg)}
.sheet{position:absolute;margin-top:8px;max-height:calc(100dvh - 145px);overflow:auto;width:min(294px,calc(100vw - 32px));padding:15px;background:var(--paper);border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 24px #35382b17}
.animals{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.animal{position:relative;display:grid;justify-items:center;gap:1px;border:1px solid transparent;background:transparent;border-radius:11px;padding:5px 2px 8px;font-size:13px}
.animal:hover{background:#eeeee3}
.animal[aria-pressed=true]{background:#e6ebdc;border-color:#a0b293}
.animal[aria-pressed=true]::after{content:"✓";position:absolute;top:4px;right:5px;font-size:11px;color:var(--fern);font-weight:bold}
.animal img{width:64px;height:60px;object-fit:contain}
.notice{margin:9px 3px 0;font-size:12px;color:var(--muted)}
.notice:empty{display:none}
.light-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px}
.light-head b{font:600 16px "Songti SC",serif;letter-spacing:.04em}
.reset{border:0;background:transparent;padding:6px 0 6px 10px;font-size:12px;color:var(--fern);text-decoration:underline;text-underline-offset:3px}
.light-row{display:grid;grid-template-columns:48px 1fr 36px;align-items:center;gap:10px;font-size:13px;min-height:38px}
input[type=range]{width:100%;margin:0;accent-color:var(--fern);cursor:pointer;height:28px}
output{text-align:right;font:13px Georgia,serif;font-variant-numeric:tabular-nums}
@media(max-width:650px){header,footer{left:6vw}.brand i{font-size:14px}header{top:max(4vh,env(safe-area-inset-top))}footer{bottom:max(5vh,env(safe-area-inset-bottom))}h1{font-size:32px}.hint{font-size:11px}.credit{font-size:10px}.controls{margin-top:12px}.trigger{min-height:44px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<canvas id="garden" aria-label="可旋转的玻璃微景观，陶土狐狸在蕨间小径旁" tabindex="0"></canvas>
<header>
  <div class="brand"><b>口袋景观</b><i>Pocket Landscape</i></div>
  <div class="controls" id="controls" hidden>
    <div class="tools">
      <button class="trigger" id="animal-trigger" aria-controls="animal-sheet" aria-expanded="false">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="5" cy="10" rx="2" ry="2.6" transform="rotate(-22 5 10)"/><ellipse cx="10" cy="6.5" rx="1.9" ry="2.6"/><ellipse cx="16" cy="7.4" rx="1.9" ry="2.6" transform="rotate(17 16 7.4)"/><path d="M7 16c1.4-1.2 2.2-4.6 5-4.6s3.4 2.9 5.1 4.6c2.1 2.3.5 4.4-2 4-2.3-.4-3.4-1.2-5.8-.4C6.4 20.6 4.8 18 7 16Z"/></svg>
        小动物<svg class="icon chevron" viewBox="0 0 12 12" aria-hidden="true"><path d="m2 4 4 4 4-4"/></svg>
      </button>
      <button class="trigger" id="light-trigger" aria-controls="light-sheet" aria-expanded="false">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M19 5l-1.5 1.5m-11 11L5 19"/></svg>
        日光<svg class="icon chevron" viewBox="0 0 12 12" aria-hidden="true"><path d="m2 4 4 4 4-4"/></svg>
      </button>
    </div>
    <section class="sheet" id="animal-sheet" aria-labelledby="animal-trigger" hidden>
      <div class="animals" role="group" aria-label="选择小动物"><!--ANIMALS--></div>
      <p class="notice" id="animal-notice" role="status"></p>
    </section>
    <section class="sheet" id="light-sheet" aria-labelledby="light-trigger" hidden>
      <div class="light-head"><b>窗边日光</b><button class="reset" id="reset-sun">恢复晨光</button></div>
      <div class="light-row"><label for="bearing">方位角</label><input id="bearing" type="range" min="0" max="360" step="1"><output for="bearing"></output></div>
      <div class="light-row"><label for="altitude">仰角</label><input id="altitude" type="range" min="15" max="80" step="1"><output for="altitude"></output></div>
    </section>
  </div>
</header>
<footer><h1>蕨间小径</h1><p class="hint">拖动旋转 · 滚轮或双指缩放</p><p class="credit"><a href="https://sketchfab.com/3d-models/pink-angel-fittonia-130670511c9144b6ac8aeb7b9f00482c" target="_blank" rel="noreferrer">Pink Angel Fittonia · harenil</a> · <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noreferrer">CC BY 4.0</a></p></footer>
<div id="status" role="status">正在打开小径…</div>
<!--APP-->
</body>
</html>
